name: verademo

on:
   push:
    branches:
      - main
   pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 17
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
    - name: Build with Maven
      run: mvn clean package

    - uses: actions/upload-artifact@v4
      with:
        name: npo-wfit-reporting-batch-1.0.0-PRJTASK0814892-STSK0201535-SNAPSHOT.jar
        path: target/npo-wfit-reporting-batch-1.0.0-PRJTASK0814892-STSK0201535-SNAPSHOT.jar
        
  pipeline_scan:
      needs: build
      runs-on: ubuntu-latest
      name: pipeline scan
      steps:
        - name: checkout repo
          uses: actions/checkout@v3

        - name: get archive
          uses: actions/download-artifact@v4
          with:
            name: npo-wfit-reporting-batch-1.0.0-PRJTASK0814892-STSK0201535-SNAPSHOT.jar
        - name: pipeline-scan action step
          id: pipelien-scan
          uses: veracode/Veracode-pipeline-scan-action@esd-true
          with:
            vid: ${{ secrets.VID }}
            vkey: ${{ secrets.VKEY }}
            file: "npo-wfit-reporting-batch-1.0.0-PRJTASK0814892-STSK0201535-SNAPSHOT.jar" 
            request_policy: "Veracode Recommended SCA Very Low"
            debug: 1
            fail_build: false

  veracode-fix:
    runs-on: ubuntu-latest
    needs: pipeline_scan
    name: create fixes
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v3

      - name: get flaw file
        uses: actions/download-artifact@v4
        with:
          name: Veracode Pipeline-Scan Results
          
      - name: Create fixes from static findings
        id: convert
        uses: veracode/veracode-fix@v1.0.6
        with:
          inputFile: results.json
          vid: ${{ secrets.VID }}
          vkey: ${{ secrets.VKEY }}
          createPR: true
          debug: false
          fixType: batch
          files: all
          cwe: '89, 117, 611'