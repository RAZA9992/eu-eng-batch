spring.batch.job.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
app.datasource.batch.url=jdbc:h2:mem:batchdb
app.datasource.batch.username=sa
app.datasource.batch.password=
app.datasource.batch.type=org.h2.Driver
app.datasource.core.url=jdbc:h2:mem:coredb
app.datasource.core.username=sa
app.datasource.core.password=
app.datasource.core.type=org.h2.Driver
app.datasource.npl.url=jdbc:h2:mem:npldb
app.datasource.npl.username=sa
app.datasource.npl.password=
app.datasource.npl.type=org.h2.Driver
app.cron=0 0 1 * * *
